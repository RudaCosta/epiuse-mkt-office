<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sem acesso · EPI-USE Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--color-neutral-light-bg);
    color: var(--color-neutral-light-text);
    font-family: 'Open Sans', Calibri, Verdana, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; text-align: center;
    background: var(--color-neutral-light-surface);
    border: 1px solid var(--color-neutral-light-border);
    border-radius: var(--rounded-lg); box-shadow: var(--elevation-md);
    padding: 40px 32px;
  }
  .icone {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: var(--rounded-full);
    display: grid; place-items: center; font-size: 26px;
    background: var(--color-primary-50); color: var(--color-brand-deep-blue);
  }
  h1 {
    font-family: Lato, Calibri, sans-serif; font-weight: 900; font-size: 22px; margin: 0 0 8px;
    color: var(--color-brand-deep-blue);
  }
  p { margin: 0 0 28px; font-size: 15px; line-height: 1.55; color: var(--color-neutral-light-text-muted); }
  a.botao {
    display: inline-block; padding: 12px 22px; border-radius: var(--rounded-md);
    background: var(--color-brand-deep-blue); color: #fff; text-decoration: none;
    font-family: Lato, Calibri, sans-serif; font-weight: 700; font-size: 14px;
  }
  a.botao:hover { background: var(--color-brand-dark-slate-blue); }
</style>
</head>
<body>
  <main class="card">
    <div class="icone" aria-hidden="true">🔒</div>
    <h1>Esta página não é da sua área</h1>
    <p>Seu acesso cobre as áreas do seu time. Se você precisa desta página para o seu trabalho, peça ao Rudá para liberar.</p>
    <a class="botao" href="/">Voltar para a minha home</a>
  </main>
</body>
</html>
