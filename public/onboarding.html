<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Onboarding Marketing · EPI-USE Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-tokens.css">
<script type="module" src="/office-nav.js"></script>
<script type="module" src="/office-footer.js"></script>
<style>
/* v2 — trilha em fases. Só tokens do DESIGN.md (regra 8); transparências via color-mix */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --o-bg: var(--color-neutral-dark-bg);
  --o-surf: var(--color-neutral-dark-surface);
  --o-glass: color-mix(in srgb, var(--color-neutral-dark-surface) 62%, transparent);
  --o-line: var(--color-neutral-dark-border);
  --o-text: var(--color-neutral-dark-text);
  --o-dim: var(--color-neutral-dark-text-dim);
  --o-muted: var(--color-neutral-dark-text-muted);
  --o-corn: var(--color-brand-cornflower-blue);
  --o-steel: var(--color-brand-steel-blue);
  --o-royal: var(--color-brand-royal-blue);
  --o-slate: var(--color-brand-dark-slate-blue);
  --o-svc: var(--color-brand-service-line-blue);
  --o-red: var(--color-brand-red);
  --o-ok: var(--color-success-500);
  --o-head: var(--type-headline-lg-font-family);
  --o-body: var(--type-body-md-font-family);
  --ease: cubic-bezier(.22,1,.36,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
html{scroll-behavior:smooth}
body{background:var(--o-bg);color:var(--o-text);font-family:var(--o-body);line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:var(--o-head);line-height:1.12;letter-spacing:-.015em}
a{color:var(--o-corn)}
button{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- FUNDO VIVO ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:drift 22s ease-in-out infinite alternate}
.b1{width:520px;height:520px;background:var(--o-svc);top:-160px;left:-120px}
.b2{width:460px;height:460px;background:var(--o-royal);bottom:-180px;right:-100px;animation-delay:-8s;opacity:.3}
.b3{width:220px;height:220px;background:var(--o-red);top:40%;left:55%;opacity:.12;animation-duration:30s}
@keyframes drift{to{transform:translate(80px,60px) scale(1.15)}}
#stars{position:absolute;inset:0;width:100%;height:100%}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:64px 0 8px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--o-head);letter-spacing:.16em;text-transform:uppercase;color:var(--o-corn);margin-bottom:16px}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--o-red);border-radius:2px}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:900;margin-bottom:16px}
.grad{background:linear-gradient(92deg,var(--o-text) 10%,var(--o-corn) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:18px;color:var(--o-dim);max-width:600px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:var(--rounded-full);font:700 15px var(--o-head);background:var(--o-red);color:var(--o-text);box-shadow:0 10px 30px -10px var(--o-red);transition:transform .25s var(--spring),box-shadow .25s}
.btn:hover{transform:translateY(-2px) scale(1.02)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--o-glass);border:1px solid var(--o-line);box-shadow:none;backdrop-filter:blur(8px)}
.btn.ghost:hover{border-color:var(--o-corn)}
.ring{position:relative;width:180px;height:180px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--o-line);stroke-width:10}
.ring .fg{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.6s var(--ease)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font:900 40px/1 var(--o-head)}
.ring-c span{font-size:12px;color:var(--o-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.phase-pill{display:inline-flex;gap:8px;align-items:center;margin-top:22px;padding:7px 14px;border-radius:var(--rounded-full);background:var(--o-glass);border:1px solid var(--o-line);font-size:13px;color:var(--o-dim)}
.phase-pill i{width:8px;height:8px;border-radius:50%;background:var(--o-ok);box-shadow:0 0 0 0 var(--o-ok);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--o-ok) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-top:40px}.ring{width:140px;height:140px;order:-1}.ring-c b{font-size:32px}}

/* ---------- MAPA DA TRILHA ---------- */
.map-wrap{position:relative;padding:48px 0 120px}
.map-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.path-base{fill:none;stroke:var(--o-line);stroke-width:3;stroke-dasharray:2 12;stroke-linecap:round}
.path-prog{fill:none;stroke:url(#pg);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1.8s var(--ease) .3s;filter:drop-shadow(0 0 6px var(--o-corn))}
.comet{fill:var(--o-text);filter:drop-shadow(0 0 8px var(--o-corn))}
.map{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.node{--y:0px;appearance:none;background:none;border:0;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;transform:translateY(var(--y));opacity:0;animation:nodeIn .8s var(--ease) forwards;animation-delay:calc(var(--i)*120ms + 200ms);transition:transform .35s var(--spring)}
.node:nth-child(even){--y:84px}
.node:hover{transform:translateY(calc(var(--y) - 6px))}
@keyframes nodeIn{from{opacity:0;transform:translateY(calc(var(--y) + 30px)) scale(.9)}to{opacity:1}}
.orb{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:radial-gradient(circle at 30% 25%,var(--o-royal),var(--o-svc) 55%,var(--o-bg));border:2px solid var(--o-line);box-shadow:0 18px 40px -16px var(--o-corn);transition:transform .35s var(--spring)}
.node:hover .orb{transform:scale(1.06) rotate(-3deg)}
.node.cur .orb{border-color:var(--o-corn)}
.node.cur .orb::before,.node.cur .orb::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--o-corn);animation:halo 2.4s var(--ease) infinite}
.node.cur .orb::after{animation-delay:1.2s}
@keyframes halo{from{transform:scale(1);opacity:.8}to{transform:scale(1.55);opacity:0}}
.node.done .orb{border-color:var(--o-ok)}
.node.lock .orb{filter:grayscale(.85) brightness(.7)}
.badge-mini{position:absolute;right:-4px;top:-4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--o-surf);border:2px solid var(--o-line)}
.node.done .badge-mini{background:var(--o-ok);border-color:var(--o-ok);color:var(--o-bg);font-weight:900}
.n-k{font:700 11px var(--o-head);letter-spacing:.14em;text-transform:uppercase;color:var(--o-muted);margin-top:10px}
.n-t{font:900 18px/1.2 var(--o-head)}
.n-s{font-size:13px;color:var(--o-dim);max-width:200px}
.pill{margin-top:8px;padding:6px 12px;border-radius:var(--rounded-full);font:700 12px var(--o-head);background:var(--o-glass);border:1px solid var(--o-line)}
.node.cur .pill{background:var(--o-red);border-color:var(--o-red)}
.node.done .pill{color:var(--o-ok);border-color:color-mix(in srgb,var(--o-ok) 50%,transparent)}
.node.lock .pill{color:var(--o-muted)}
@media (max-width:820px){
  .map{grid-template-columns:1fr;gap:34px}
  .node{width:72%;flex-direction:row;text-align:left;gap:14px}
  .node .n-txt{display:flex;flex-direction:column;align-items:flex-start}
  .node:nth-child(even){--y:0px;justify-self:end}
  .orb{flex:0 0 76px;width:76px;height:76px;font-size:32px}
  .n-k{margin-top:0}
}
.n-txt{display:contents}
@media (max-width:820px){.n-txt{display:flex}}

/* ---------- TOAST / FAB / DRAWER ---------- */
.toast{position:fixed;left:50%;bottom:28px;z-index:1200;transform:translate(-50%,40px);opacity:0;padding:12px 18px;border-radius:var(--rounded-full);background:var(--o-surf);border:1px solid var(--o-line);font-weight:600;font-size:14px;transition:all .45s var(--spring);pointer-events:none;box-shadow:0 20px 40px -20px var(--o-bg)}
.toast.on{transform:translate(-50%,0);opacity:1}
.fab{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:var(--rounded-full);border:1px solid var(--o-line);background:var(--o-glass);backdrop-filter:blur(12px);cursor:pointer;font:700 14px var(--o-head);transition:transform .3s var(--spring)}
.fab:hover{transform:translateY(-3px)}
.scrim{position:fixed;inset:0;z-index:890;background:color-mix(in srgb,var(--o-bg) 60%,transparent);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.35s}
.scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;z-index:900;width:min(460px,100%);height:100%;display:flex;flex-direction:column;background:var(--o-surf);border-left:1px solid var(--o-line);transform:translateX(105%);transition:transform .5s var(--ease)}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px}
.dr-head h3{font-size:22px}
.x{appearance:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--o-line);background:transparent;cursor:pointer;font-size:18px;transition:transform .3s var(--spring)}
.x:hover{transform:rotate(90deg)}
.tabs{display:flex;gap:6px;padding:0 22px 14px;border-bottom:1px solid var(--o-line)}
.tab{appearance:none;border:1px solid var(--o-line);background:transparent;padding:8px 14px;border-radius:var(--rounded-full);cursor:pointer;font:700 13px var(--o-head)}
.tab.on{background:var(--o-royal);border-color:var(--o-corn)}
.dr-body{flex:1;overflow:auto;padding:18px 22px 40px}
.dr-body > *{animation:up .5s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.bar{height:8px;border-radius:8px;background:var(--o-line);overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o-corn),var(--o-ok));transition:width .6s var(--ease)}
.chk{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--o-line);margin-bottom:8px;cursor:pointer;transition:background .25s,border-color .25s}
.chk:hover{border-color:var(--o-corn)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.box{flex:0 0 24px;height:24px;border-radius:8px;border:2px solid var(--o-muted);display:grid;place-items:center;transition:.3s var(--spring)}
.box::after{content:'✓';font-weight:900;font-size:14px;color:var(--o-bg);transform:scale(0);transition:transform .3s var(--spring)}
.chk.on{background:color-mix(in srgb,var(--o-ok) 10%,transparent);border-color:color-mix(in srgb,var(--o-ok) 45%,transparent)}
.chk.on .box{background:var(--o-ok);border-color:var(--o-ok);transform:rotate(-8deg)}
.chk.on .box::after{transform:scale(1)}
.chk b{display:block;font-size:14px}
.chk small{display:block;font-size:12px;color:var(--o-muted)}
.chk a{margin-left:auto;font-size:12px;white-space:nowrap}
.tag{display:inline-block;font:700 11px/1 var(--o-head);padding:5px 9px;border-radius:var(--rounded-full);border:1px solid var(--color-warning-500);color:var(--color-warning-500);white-space:nowrap}
.note{font-size:12.5px;color:var(--o-muted);margin-top:14px}
.person{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--o-line)}
.av{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font:900 15px var(--o-head);background:linear-gradient(135deg,var(--o-royal),var(--o-svc));border:1px solid var(--o-line)}
.person b{display:block}
.person span{font-size:13px;color:var(--o-dim)}
.person em{display:block;font-style:normal;font-size:12px;color:var(--o-muted)}
.tip{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--o-line)}
.tip > span{font-size:24px}
.tip p{font-size:14px;color:var(--o-dim)}
.dict-q{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--o-line);background:var(--o-bg);color:var(--o-text);font:inherit;margin-bottom:14px}
.dict-q:focus{outline:2px solid var(--o-corn);outline-offset:1px}
.term{padding:12px 0;border-bottom:1px solid var(--o-line);font-size:14px}
.term b{font-family:var(--o-head);color:var(--o-corn)}
.term p{color:var(--o-dim)}

/* ---------- PLAYER (modo foco) ---------- */
.player{position:fixed;inset:0;z-index:1000;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(ellipse 80% 60% at 15% 0%,color-mix(in srgb,var(--o-royal) 40%,transparent),transparent 60%),radial-gradient(ellipse 60% 50% at 100% 100%,color-mix(in srgb,var(--o-svc) 70%,transparent),transparent 70%),var(--o-bg);opacity:0;visibility:hidden;transform:scale(1.02);transition:opacity .45s var(--ease),transform .45s var(--ease),visibility .45s}
.player.on{opacity:1;visibility:visible;transform:none}
.p-top{display:flex;align-items:center;gap:14px;padding:16px 20px}
.p-title{font:700 13px var(--o-head);color:var(--o-dim);white-space:nowrap}
.segs{display:flex;gap:5px;flex:1}
.seg{flex:1;height:5px;border-radius:5px;background:var(--o-line);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--o-corn);transition:width .6s var(--ease)}
.seg.done i,.seg.cur i{width:100%}
.seg.quiz i{background:var(--o-red)}
.stage{position:relative;overflow-y:auto;overflow-x:hidden;padding:8px 20px 24px}
.slide{max-width:1140px;min-height:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1.08fr;gap:48px;align-items:center}
@media (max-width:880px){.slide{grid-template-columns:1fr;gap:20px;align-items:start}.s-viz{order:-1}.p-title{display:none}}
.st{opacity:0;animation:stIn .75s var(--ease) forwards;animation-delay:calc(var(--i,0)*85ms + 80ms)}
.dir-next .st{--fx:28px}.dir-prev .st{--fx:-28px}
@keyframes stIn{from{opacity:0;transform:translateX(var(--fx,0)) translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.s-eyebrow{font:700 12px var(--o-head);letter-spacing:.16em;text-transform:uppercase;color:var(--o-corn);margin-bottom:14px}
.slide h2{font-size:clamp(28px,4.2vw,48px);font-weight:900;margin-bottom:16px}
.s-lead{font-size:clamp(16px,1.6vw,19px);color:var(--o-dim);margin-bottom:18px}
.s-list{list-style:none;display:grid;gap:10px;margin-bottom:16px}
.s-list li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;color:var(--o-dim)}
.s-list li::before{content:'';flex:0 0 8px;height:8px;margin-top:9px;border-radius:50%;background:var(--o-red)}
.s-viz{position:relative;min-height:400px;border-radius:28px;border:1px solid var(--o-line);background:linear-gradient(160deg,var(--o-glass),color-mix(in srgb,var(--o-bg) 50%,transparent));backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 40px 80px -40px color-mix(in srgb,var(--o-bg) 90%,transparent)}
.s-viz.auto{min-height:0;padding:22px}
.s-viz.tall{min-height:440px}
@media (max-width:880px){.s-viz.tall{min-height:390px}}
@media (max-width:880px){.s-viz{min-height:290px}}
.viz-cv{position:absolute;inset:0;display:block}
.viz-cap{position:absolute;left:16px;bottom:12px;font-size:11.5px;color:var(--o-muted);z-index:2}
.p-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--o-line);background:color-mix(in srgb,var(--o-bg) 70%,transparent);backdrop-filter:blur(10px)}
.count{font:700 13px var(--o-head);color:var(--o-muted)}
.p-bot .btn[disabled]{opacity:.35;pointer-events:none}
.kbd{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid var(--o-line);font-size:11px;margin:0 2px}
@media (max-width:600px){.hint{display:none}}

/* KPIs + contadores */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.kpi{padding:14px 16px;border-radius:18px;background:var(--o-glass);border:1px solid var(--o-line)}
.kpi b{display:block;font:900 30px/1 var(--o-head);color:var(--o-text)}
.kpi span{font-size:13px;color:var(--o-muted)}
.src{font-size:11.5px;color:var(--o-muted);margin-top:10px}

/* Linha do tempo */
.tl{position:relative;padding:34px 24px 20px 72px}
.tl-track{position:absolute;left:40px;top:40px;bottom:46px;width:3px;border-radius:3px;background:var(--o-line)}
.tl-track i{display:block;width:100%;height:0;border-radius:3px;background:linear-gradient(var(--o-corn),var(--o-ok));animation:grow 3.2s var(--ease) .3s forwards}
@keyframes grow{to{height:100%}}
.tl-ele{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);font-size:28px;animation:walk 3.2s var(--ease) .3s forwards;filter:drop-shadow(0 4px 10px var(--o-bg))}
.tl-ele span{display:inline-block;animation:bob .5s ease-in-out infinite alternate}
@keyframes walk{to{top:100%}}
@keyframes bob{to{transform:translateY(-4px) rotate(-4deg)}}
.tl ol{list-style:none}
.tl li{position:relative;margin-bottom:20px;opacity:0;animation:stIn .7s var(--ease) forwards;animation-delay:calc(.5s + var(--i)*.6s)}
.tl li::before{content:'';position:absolute;left:-39px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--o-bg);border:3px solid var(--o-corn)}
.tl li b{display:block;font:900 24px/1.1 var(--o-head);color:var(--o-corn)}
.tl li span{font-size:14px;color:var(--o-dim)}

/* Chips de filtro sobre canvas */
.viz-chips{position:absolute;left:14px;top:14px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.vchip{appearance:none;cursor:pointer;padding:6px 12px;border-radius:var(--rounded-full);border:1px solid var(--o-line);background:var(--o-glass);font:700 12px var(--o-head);backdrop-filter:blur(6px)}
.vchip.on{background:var(--o-royal);border-color:var(--o-corn)}
.viz-info{position:absolute;left:14px;right:14px;bottom:14px;z-index:2;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--o-bg) 75%,transparent);border:1px solid var(--o-line);font-size:13.5px;color:var(--o-dim);min-height:48px;backdrop-filter:blur(8px);transition:border-color .3s}
.viz-info.hl{border-color:var(--o-corn)}
.viz-info b{color:var(--o-text)}

/* Braços no Brasil */
.arms{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.arm{padding:18px;border-radius:20px;background:var(--o-glass);border:1px solid var(--o-line);opacity:0;animation:fly .9s var(--spring) forwards;animation-delay:calc(.25s + var(--i)*.14s)}
.arm .e{font-size:26px}
.arm b{display:block;font:900 16px var(--o-head);margin:6px 0 2px}
.arm span{font-size:13px;color:var(--o-dim)}
@keyframes fly{from{opacity:0;transform:translate(calc(var(--x)*70px),calc(var(--y)*70px)) scale(.4)}to{opacity:1;transform:none}}
.arm-core{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--o-bg);border:2px solid var(--o-corn);z-index:2;animation:pop .6s var(--spring) both}
.arm-core::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--o-corn);animation:halo 2.4s infinite}
@keyframes pop{from{transform:scale(0)}}
.namecheck{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.nc{padding:10px 16px;border-radius:14px;font:900 18px var(--o-head);border:1px solid var(--o-line);background:var(--o-glass)}
.nc-no{position:relative;color:var(--o-muted)}
.nc-no::after{content:'';position:absolute;left:10px;right:10px;top:50%;height:3px;border-radius:3px;background:var(--o-red);transform:scaleX(0);transform-origin:left;animation:strike .5s var(--ease) 1.1s forwards}
@keyframes strike{to{transform:scaleX(1)}}
.nc-yes{border-color:var(--o-ok);animation:glow 2s 1.6s infinite}
.nc-yes::after{content:' ✓';color:var(--o-ok)}

/* Anel de receita */
.rev{position:relative;width:min(360px,86%);aspect-ratio:1;margin:34px auto;container-type:inline-size}
.rev svg{position:absolute;inset:0;width:100%;height:100%}
.rev-tr{fill:none;stroke:var(--o-line);stroke-width:3;stroke-dasharray:3 9}
.rev-arc{fill:none;stroke:var(--o-corn);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--o-corn));transform-origin:50% 50%}
.rev-n{appearance:none;cursor:pointer;position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;display:grid;place-content:center;gap:2px;font-size:26px;background:var(--o-surf);border:2px solid var(--o-line);transform:rotate(var(--a)) translate(38cqw) rotate(calc(-1*var(--a)));transition:border-color .3s,background .3s,box-shadow .3s}
.rev-n small{font:700 10.5px var(--o-head);color:var(--o-dim)}
.rev-n.on{border-color:var(--o-corn);background:var(--o-royal);box-shadow:0 0 30px -4px var(--o-corn)}
.rev-c{position:absolute;inset:26%;display:grid;place-content:center;text-align:center;gap:4px}
.rev-c b{font:900 min(22px,6.4cqw) var(--o-head)}
.rev-c span{font-size:min(13px,3.9cqw);color:var(--o-dim)}
.fade{animation:fadeIn .45s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}

/* LOBs */
.lobs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:26px 8px 100px}
.lob{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:var(--rounded-full);border:1px solid var(--o-line);background:var(--o-glass);font:700 14px var(--o-head);opacity:0;animation:drop .8s var(--spring) forwards,float 4s ease-in-out infinite alternate;animation-delay:calc(var(--i)*.1s + .2s),calc(var(--i)*-.6s);transition:border-color .3s,background .3s}
.lob i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lob:hover,.lob.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.8)}to{opacity:1}}
@keyframes float{to{translate:0 -6px}}

/* IPs tilt */
.ips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;perspective:900px}
.ip{position:relative;padding:18px;border-radius:20px;background:var(--o-glass);border:1px solid var(--o-line);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,border-color .3s;opacity:0;animation:stIn .7s var(--ease) forwards;animation-delay:calc(var(--i)*.1s + .2s);overflow:hidden;transform-style:preserve-3d}
.ip::after{content:'';position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--o-text) 16%,transparent),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.ip:hover{border-color:var(--o-corn)}
.ip:hover::after{opacity:1}
.ip .e{font-size:28px;display:block;transform:translateZ(30px)}
.ip b{display:block;font:900 16px var(--o-head);margin:8px 0 2px}
.ip span{font-size:13px;color:var(--o-dim)}

/* Marca */
.brand{display:grid;gap:12px}
.paper{display:grid;gap:12px;padding:16px;border-radius:22px;background:var(--color-brand-stone-gray);color:var(--color-brand-text-dark-grey)}
.paper .src{color:var(--color-brand-text-dark-grey);margin-top:6px}
.sw-main{height:120px;border-radius:16px;background:var(--color-brand-deep-blue);color:var(--o-text);display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;animation:stIn .7s var(--ease) both}
.sw-main b{font:900 18px var(--o-head)}
.sw-main span,.sw small{font-size:11.5px;color:var(--o-dim)}
.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{height:64px;border-radius:14px;background:var(--c);border:1px solid var(--o-line);transition:transform .35s var(--spring);opacity:0;animation:popIn .6s var(--spring) forwards;animation-delay:calc(.2s + var(--i)*.07s)}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.sw:hover{transform:translateY(-6px) scale(1.05)}
.ratio{display:flex;height:16px;border-radius:16px;overflow:hidden;background:color-mix(in srgb,var(--color-brand-text-dark-grey) 12%,transparent)}
.ratio i{display:block;height:100%;width:0;animation:fill 1.6s var(--ease) .6s forwards}
.ratio .r1{background:var(--color-brand-deep-blue);--w:78%}
.ratio .r2{background:var(--o-royal);--w:14%;animation-delay:.9s}
.ratio .r3{background:var(--o-red);--w:8%;animation-delay:1.2s}
@keyframes fill{to{width:var(--w)}}
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{padding:14px;border-radius:16px;background:var(--o-glass);border:1px solid var(--o-line)}
.type .big{font-size:30px;line-height:1}
.type small{display:block;font-size:12px;color:var(--o-muted);margin-top:4px}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.dd div{padding:12px 14px;border-radius:14px;border:1px solid var(--o-line);background:var(--o-glass);font-size:13.5px;color:var(--o-dim)}

/* Links */
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lk{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--o-line);background:var(--o-glass);text-decoration:none;color:var(--o-text);font-size:14px;font-weight:600;opacity:0;animation:stIn .6s var(--ease) forwards;animation-delay:calc(var(--i)*.06s + .15s);transition:border-color .3s,transform .3s var(--spring)}

.lk .e{font-size:22px}
.lk small{display:block;font-size:11.5px;color:var(--o-muted);font-weight:400}
.mini-links{display:flex;flex-wrap:wrap;gap:8px}
.mini-links a{font-size:13px;padding:7px 12px;border-radius:var(--rounded-full);border:1px solid var(--o-line);text-decoration:none;background:var(--o-glass);transition:border-color .3s}

/* Quiz + conclusão */
.qz{max-width:720px;margin:0 auto;padding-top:4vh}

.q-opt:hover{border-color:var(--o-corn);transform:translateX(4px)}

.q-opt.ok{border-color:var(--o-ok);background:color-mix(in srgb,var(--o-ok) 16%,transparent)}

.q-opt.ko{border-color:var(--o-red);background:color-mix(in srgb,var(--o-red) 14%,transparent);animation:shake .45s}

.q-opts.locked .q-opt{pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.q-fb{min-height:54px;margin:16px 0;font-size:15px;color:var(--o-dim)}
.q-fb b{color:var(--o-text)}
.done-wrap{max-width:640px;margin:0 auto;padding-top:5vh;text-align:center;display:flex;flex-direction:column;align-items:center}
.medal{position:relative;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font-size:84px;margin-bottom:26px;background:radial-gradient(circle at 35% 30%,var(--o-royal),var(--o-svc) 60%,var(--o-bg));border:3px solid var(--o-corn);animation:medal 1.1s var(--spring) both;box-shadow:0 0 80px -10px var(--o-corn)}
.medal::before{content:'';position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,var(--o-corn),var(--o-red),var(--o-ok),var(--o-corn));z-index:-1;animation:spin 6s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),black calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),black calc(100% - 3px))}
@keyframes medal{from{transform:rotateY(180deg) scale(.3);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

<script>
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LS = 'eubr-onboarding-v2';
const $ = (q, el = document) => el.querySelector(q);
const $$ = (q, el = document) => [...el.querySelectorAll(q)];
let S = {};
try { S = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch { S = {}; }
S.access = S.access || {}; S.e1 = S.e1 || { max: 0, done: false, score: 0 };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} };

/* Cores dos tokens → canvas (nada de hex local) */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const K = {
  bg: css('--color-neutral-dark-bg'), surf: css('--color-neutral-dark-surface'), text: css('--color-neutral-dark-text'),
  dim: css('--color-neutral-dark-text-dim'), muted: css('--color-neutral-dark-text-muted'),
  blue: css('--color-brand-deep-blue'), red: css('--color-brand-red'), corn: css('--color-brand-cornflower-blue'),
  royal: css('--color-brand-royal-blue'), steel: css('--color-brand-steel-blue'), slate: css('--color-brand-dark-slate-blue'),
  svc: css('--color-brand-service-line-blue'), stone: css('--color-brand-stone-gray'), ok: css('--color-success-500')
};
const rgba = (hex, a) => { const h = (hex || '#000').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

/* ======================= DADOS ======================= */
const ACCESS = [
  ['rd', 'RD Station Marketing', 'E-mail, LPs, automação', 'https://app.rdstation.com.br'],
  ['crm', 'Zoho CRM', 'Deals, pipeline e receita', 'https://crm.zoho.com'],
  ['cms', 'Site EUBR (HubSpot CMS)', 'Usuário de editor', 'https://app.hubspot.com'],
  ['str', 'Site Stratview', 'Usuário de editor do CMS', null],
  ['sfsf', 'SuccessFactors EUBR', 'Portal do colaborador', null],
  ['nav', 'LinkedIn Sales Navigator', 'Licença com o gestor', 'https://www.linkedin.com/sales/'],
  ['canva', 'Canva (time EPI-USE)', 'Convite com brand kit', 'https://www.canva.com'],
  ['trello', 'Trello', 'Board do time de marketing', 'https://trello.com'],
  ['suser', 'SAP S-user', 'SAP for Me e Partner Edge', 'https://me.sap.com'],
  ['multi', 'Multidados', 'Horas e despesas', null],
  ['office', 'EPI-USE Office', 'Login SSO Microsoft', '/hub']
];
const TEAM = [
  ['RC', 'Rudá Costa', 'Head RevOps & Marketing', 'Estratégia, pipeline, SLA com vendas, Office'],
  ['BY', 'Bruna Yamagami', 'Marketing Intelligence & CRM', 'CRM, lead scoring, dashboards de funil'],
  ['GM', 'Guilherme Marques (Gui)', 'Growth & Performance', 'Mídia paga, SEO, pautas, LinkedIn'],
  ['GS', 'Gabrielle Senne', 'Field Marketing', 'Eventos BR/LATAM, MDF SAP, ativações'],
  ['ME', 'Marlison Estrela', 'Development Sales', 'Outbound Apollo, prospecção C-Level'],
  ['DH', 'Eduarda Hirose (Duda)', 'Brand Experience', 'Identidade visual, Voices, aprovação de conteúdo'],
  ['R', 'Roberto', 'Country Manager Brasil', 'Aprovação executiva e orçamento'],
  ['LA', 'Lisiane de Assis', 'Redatoria (parceira externa)', 'Tom de voz e artigos']
];
const TIPS = [
  ['💡', '<b>Luz:</b> de frente para o rosto (janela ou ring light). Nunca contraluz.'],
  ['🔇', '<b>Barulho:</b> fone com microfone, ambiente fechado, mute quando não estiver falando.'],
  ['🖼️', '<b>Fundo:</b> neutro ou o background oficial EPI-USE (em <a href="/brand">/brand</a>). Câmera ligada com cliente.'],
  ['⏱️', '<b>Horas:</b> lance no Multidados na frequência combinada com o gestor, sem acumular. <span class="tag">⏳ link a preencher</span>'],
  ['🧾', '<b>Despesas:</b> também no Multidados, com nota fiscal anexada.']
];
const DICT = [
  ['ABM','Marketing direcionado a contas-alvo específicas.'],['AMS','Suporte e sustentação contínua do SAP.'],
  ['AEO / GEO','Otimização para aparecer em respostas de IA.'],['ASUG','Associação de usuários SAP: eventos e comunidade.'],
  ['BANT','Qualificação: Budget, Authority, Need, Timing.'],['Binds','Pesquisa de NPS com clientes.'],
  ['BTP','SAP Business Technology Platform: extensões, integrações, dados e IA.'],['Cadência','Sequência planejada de contatos de prospecção.'],
  ['CIV','Indicador de valor do parceiro no programa SAP.'],['Clean Core','ERP sem customizações no núcleo; extensões ficam no BTP.'],
  ['CS','Customer Success: resultado, retenção e expansão do cliente.'],['ECC','ERP legado da SAP, substituído pelo S/4HANA.'],
  ['ERP','Sistema integrado de gestão (finanças, compras, vendas, RH...).'],['ERP.ngo','Braço social do grupo: 1% da receita global para conservação e comunidades.'],
  ['Group Elephant','Holding que reúne a EPI-USE e outras 20+ marcas.'],['HCM','Soluções de RH, folha e talentos.'],
  ['ICP','Perfil da empresa ideal para vender.'],['Inbound','Atrair o cliente com conteúdo e oferta.'],
  ['IP','Propriedade intelectual: software/acelerador próprio.'],['LOB','Line of Business: linha de solução.'],
  ['MDF','Verba da SAP para cofinanciar marketing de parceiros.'],['MQL','Lead que o marketing considera pronto para vendas.'],
  ['NPS','Métrica de lealdade do cliente.'],['Outbound','Prospecção ativa.'],['PBC','Partner Benefits Catalog da SAP.'],
  ['REX','Indicador de experiência do parceiro SAP.'],['RevOps','Marketing, vendas e CS alinhados em torno da receita.'],
  ['RISE / GROW','Pacotes SAP para levar clientes ao S/4HANA Cloud.'],['S/4HANA','ERP atual da SAP.'],
  ['S-user','Usuário para portais e suporte SAP.'],['SDR','Prospecta e qualifica leads.'],['Signavio','Modelagem e mineração de processos.'],
  ['SQL','Lead aceito e qualificado por vendas.'],['SuccessFactors','Suíte SAP de RH em nuvem.'],
  ['TBT','Throwback Thursday: post de memória às quintas.'],['UTM','Parâmetros no link que rastreiam a origem do tráfego.'],
  ['Voices','Programa de especialistas embaixadores no LinkedIn.']
];
const STAGES = [
  { k: 'd1', kick: 'Comece aqui', t: 'Kit Dia 1', s: 'Acessos · time · rotina', ico: '🎒', phase: 1 },
  { k: 'e1', kick: 'Etapa 1', t: 'Marca & Grupo', s: 'EPI-USE · Group Elephant · ERP.ngo', ico: '🐘', phase: 1 },
  { k: 'e2', kick: 'Etapa 2', t: 'Estratégia & Demanda', s: 'Funil · RevOps · Eventos', ico: '🚀', phase: 2 },
  { k: 'e3', kick: 'Etapa 3', t: 'SAP & Técnico', s: 'ERP · HCM · BTP · ServiceNow', ico: '🧪', phase: 3 },
  { k: 'e4', kick: 'Etapa 4', t: 'Comercial', s: 'Receita Previsível · SDR', ico: '📞', phase: 4 }
];

/* ======================= FUNDO: estrelas ======================= */
const bgStop = (() => {
  const c = $('#stars'), x = c.getContext('2d'); let W, H, stars = [], raf = 0, shoot = null, paused = false;
  const fit = () => { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 14000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, p: Math.random() * 6 })); };
  fit(); addEventListener('resize', fit);
  const draw = t => {
    x.clearRect(0, 0, W, H);
    stars.forEach(s => { x.globalAlpha = .25 + .55 * (.5 + .5 * Math.sin(t * 1.3 + s.p)); x.fillStyle = K.dim; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); });
    if (!shoot && Math.random() < .004) shoot = { x: Math.random() * W * .7, y: Math.random() * H * .4, l: 0 };
    if (shoot) { shoot.l += .022; const k = shoot.l, sx = shoot.x + k * 420, sy = shoot.y + k * 160;
      const g = x.createLinearGradient(sx - 90, sy - 34, sx, sy); g.addColorStop(0, rgba(K.text, 0)); g.addColorStop(1, rgba(K.text, .9 * (1 - k)));
      x.globalAlpha = 1; x.strokeStyle = g; x.lineWidth = 2; x.beginPath(); x.moveTo(sx - 90, sy - 34); x.lineTo(sx, sy); x.stroke(); if (k >= 1) shoot = null; }
    x.globalAlpha = 1;
  };
  const loop = n => { if (!paused && !document.hidden) draw(n / 1000); raf = requestAnimationFrame(loop); };
  if (reduce) draw(0); else raf = requestAnimationFrame(loop);
  return v => { paused = v; };
})();

/* ======================= MAPA ======================= */
const map = $('#map');
function stageStatus(st) {
  if (st.phase > 1) return { cls: 'lock', pill: `🔒 Fase ${st.phase} · em breve`, badge: '🔒' };
  if (st.k === 'd1') { const n = ACCESS.filter(a => S.access[a[0]]).length;
    return n === ACCESS.length ? { cls: 'done', pill: '✓ Completo', badge: '✓' } : { cls: '', pill: n ? `${n}/${ACCESS.length} acessos` : '▶ Abrir kit', badge: '' }; }
  if (S.e1.done) return { cls: 'done', pill: '✓ Concluída', badge: '✓' };
  return { cls: '', pill: S.e1.max > 0 ? '▶ Continuar' : '▶ Começar', badge: '' };

    if (pin < 0) setActive(((Math.round((head + 90) / 90) % 4) + 4) % 4);
    raf = requestAnimationFrame(f);
  };
  raf = requestAnimationFrame(f);
  return () => cancelAnimationFrame(raf);
}

/* ---- 8. ERP.ngo: fluxo do 1% ---- */
function vizNgo(el) {
  el.insertAdjacentHTML('beforeend', '<span class="viz-cap">📝 Ilustrativo — fluxo didático, não é volume real</span>');
  const parts = Array.from({ length: 140 }, (_, i) => ({ o: Math.random(), s: .1 + Math.random() * .08, ngo: i % 14 === 0, j: Math.random() * 2 - 1 }));
  return canvasViz(el, (g, t) => {
    const x = g.ctx, { W, H } = g;
    x.globalCompositeOperation = 'destination-out'; x.fillStyle = 'rgba(0,0,0,0.22)'; x.fillRect(0, 0, W, H); x.globalCompositeOperation = 'source-over';
    const A = [W * .14, H * .5], B = [W * .48, H * .5], N = [W * .84, H * .27], O = [W * .84, H * .72];
    parts.forEach(p => {
      const k = (p.o + t * p.s) % 1; let px, py;
      if (k < .5) { const q = ease(k / .5); px = A[0] + (B[0] - A[0]) * q; py = A[1] + p.j * 40 * Math.sin(q * Math.PI); }
      else { const q = ease((k - .5) / .5), T = p.ngo ? N : O, mx = (B[0] + T[0]) / 2; px = (1 - q) * (1 - q) * B[0] + 2 * (1 - q) * q * mx + q * q * T[0]; py = (1 - q) * (1 - q) * B[1] + 2 * (1 - q) * q * (p.ngo ? B[1] - 60 : B[1] + 60) + q * q * T[1]; }
      const red = p.ngo && k > .5; x.fillStyle = red ? K.red : K.corn; x.beginPath(); x.arc(px, py, red ? 4 : 2.2, 0, 7); x.fill();
    });
    const node = (P, ico, l, col, glow) => { if (glow) { x.shadowColor = col; x.shadowBlur = 24 + Math.sin(t * 3) * 8; } pillPath(x, P[0], P[1], 132, 50); x.fillStyle = col; x.fill(); x.shadowBlur = 0; label(x, ico + ' ' + l, P[0], P[1], { size: 13 }); };
    node(A, '🤝', 'Projetos', K.slate); node(B, '💰', 'Receita global', K.royal); node(N, '🐘', '1% ERP.ngo', K.red, true); node(O, '🏢', '99% operação', K.svc);
  });
}

/* ======================= PLAYER ======================= */
const player = $('#player'), stage = $('#stage');
const P = { i: 0, mode: 'slides', qi: 0, score: 0, stop: null };
function stopViz() { if (P.stop) { try { P.stop(); } catch {} P.stop = null; } }
function openPlayer() {
  P.mode = 'slides'; P.i = S.e1.done ? 0 : Math.min(S.e1.max, SLIDES.length - 1);
  $('#pTitle').textContent = '🐘 Etapa 1 · Marca & Grupo';

  render('next'); setTimeout(() => $('#pNext').focus(), 300);
}
function closePlayer() { stopViz(); player.classList.remove('on'); document.body.style.overflow = ''; bgStop(false); renderMap(); }
$('#pClose').addEventListener('click', closePlayer);
function segs() {
  const n = SLIDES.length, cur = P.mode === 'slides' ? P.i : n;
  $('#segs').innerHTML = Array.from({ length: n + 1 }, (_, k) => `<div class="seg ${k < cur ? 'done' : ''} ${k === cur ? 'cur' : ''} ${k === n ? 'quiz' : ''}"><i></i></div>`).join('');
}
function render(dir) {
  stopViz(); stage.className = 'stage dir-' + dir; stage.scrollTop = 0;
  const s = SLIDES[P.i];
  stage.innerHTML = `<div class="slide"><div class="s-txt">
    <div class="s-eyebrow st" style="--i:0">${s.e}</div><h2 class="st" style="--i:1">${s.t}</h2><p class="s-lead st" style="--i:2">${s.l}</p>
    ${s.b ? `<ul class="s-list">${s.b.map((b, k) => `<li class="st" style="--i:${k + 3}"><span>${b}</span></li>`).join('')}</ul>` : ''}
    ${s.x ? `<div class="st" style="--i:${(s.b ? s.b.length : 0) + 3}">${s.x}</div>` : ''}
  </div><div class="s-viz st" style="--i:1"></div></div>`;
  P.stop = s.v($('.s-viz', stage)) || null;
  $$('[data-count]', stage).forEach(el => setTimeout(() => countTo(el, +el.dataset.count, el.dataset.suf || ''), 400));
  S.e1.max = Math.max(S.e1.max, P.i); save();
  segs();
  $('#pBot').style.display = '';
  $('#pPrev').disabled = P.i === 0;
  $('#pCount').textContent = `${P.i + 1} / ${SLIDES.length}`;
  $('#pNext').textContent = P.i === SLIDES.length - 1 ? 'Ir para o quiz →' : 'Próximo →';
}
function next() { if (P.mode !== 'slides') return; if (P.i < SLIDES.length - 1) { P.i++; render('next'); } else { S.e1.max = SLIDES.length; save(); P.mode = 'quiz'; P.qi = 0; P.score = 0; renderQuiz('next'); } }
function prev() { if (P.mode === 'slides' && P.i > 0) { P.i--; render('prev'); } }
$('#pNext').addEventListener('click', next); $('#pPrev').addEventListener('click', prev);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (player.classList.contains('on')) closePlayer(); else if (drawer.classList.contains('on')) closeDrawer(); return; }
  if (!player.classList.contains('on') || e.target.matches('input')) return;
  if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev();
});
let tx = null;
stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60 && !e.target.closest('canvas,.ip')) dx < 0 ? next() : prev(); tx = null; });

function renderQuiz(dir) {
  stopViz(); stage.className = 'stage dir-' + dir; stage.scrollTop = 0; segs(); $('#pBot').style.display = 'none';
  const q = QUIZ[P.qi];
  stage.innerHTML = `<div class="qz"><div class="q-meta st" style="--i:0">Quiz · pergunta ${P.qi + 1} de ${QUIZ.length}</div><h2 class="st" style="--i:1">${q.q}</h2>
    <div class="q-opts">${q.o.map((o, j) => `<button class="q-opt st" style="--i:${j + 2}" data-j="${j}"><b>${'ABC'[j]}</b><span>${o}</span></button>`).join('')}</div>
    <div class="q-fb" aria-live="polite"></div><button class="btn q-next" hidden>${P.qi < QUIZ.length - 1 ? 'Próxima pergunta →' : 'Ver resultado →'}</button></div>`;
  const opts = $('.q-opts', stage);
  $$('.q-opt', stage).forEach(b => b.addEventListener('click', () => {
    if (opts.classList.contains('locked')) return; opts.classList.add('locked');
    const j = +b.dataset.j, ok = j === q.a; if (ok) P.score++;
    b.classList.add(ok ? 'ok' : 'ko'); if (!ok) $$('.q-opt', stage)[q.a].classList.add('ok');

    const nb = $('.q-next', stage); nb.hidden = false; nb.focus();
  }));
  $('.q-next', stage).addEventListener('click', () => { if (P.qi < QUIZ.length - 1) { P.qi++; renderQuiz('next'); } else renderResult(); });
}
function renderResult() {
  stage.className = 'stage dir-next'; P.mode = 'done';
  const pass = P.score >= Math.ceil(QUIZ.length * .75);
  $$('.seg').forEach(s => { s.classList.add('done'); });
  if (pass) { S.e1.done = true; S.e1.score = Math.max(S.e1.score, P.score); save(); setTimeout(() => confetti(), 250); }
  stage.innerHTML = pass ? `<div class="done-wrap"><div class="medal">🐘</div>
      <div class="s-eyebrow st" style="--i:1">Etapa 1 concluída · ${P.score}/${QUIZ.length} no quiz</div>

    : `<div class="done-wrap"><div class="medal" style="filter:grayscale(.6)">🤔</div>
      <div class="s-eyebrow st" style="--i:1">${P.score}/${QUIZ.length} no quiz</div>
      <h2 class="st" style="--i:2">Faltou pouco!</h2>
      <p class="s-lead st" style="--i:3">Acerte pelo menos ${Math.ceil(QUIZ.length * .75)} de ${QUIZ.length} para concluir a etapa.</p>
      <div class="cta-row st" style="--i:4"><button class="btn" data-a="retry">Tentar de novo</button><button class="btn ghost" data-a="review">Rever os slides</button></div></div>`;
  $$('[data-a]', stage).forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.a;
    if (a === 'map') closePlayer();
    if (a === 'review') { P.mode = 'slides'; P.i = 0; render('prev'); }
    if (a === 'retry') { P.mode = 'quiz'; P.qi = 0; P.score = 0; renderQuiz('next'); }
  }));
}

/* ======================= CONFETE ======================= */
const cf = $('#confetti'), cx2 = cf.getContext('2d');
const CP = []; let cfRun = false;
function confetti(origin) {
  if (reduce) return;
  const d = Math.min(2, devicePixelRatio || 1); cf.width = innerWidth * d; cf.height = innerHeight * d; cx2.setTransform(d, 0, 0, d, 0, 0);
  const cols = [K.corn, K.red, K.ok, K.stone, K.royal];
  const ox = origin ? origin[0] : innerWidth / 2, oy = origin ? origin[1] : innerHeight * .38, n = origin ? 40 : 180;
  for (let k = 0; k < n; k++) { const a = Math.random() * Math.PI * 2, v = (origin ? 4 : 7) + Math.random() * (origin ? 5 : 9);
    CP.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (origin ? 3 : 6), r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, c: cols[Math.floor(Math.random() * cols.length)], life: 1 }); }
  if (cfRun) return; cfRun = true;
  // um único loop para todos os disparos (sem flicker quando dois se sobrepõem)
  const f = () => { cx2.clearRect(0, 0, innerWidth, innerHeight);
    for (let k = CP.length - 1; k >= 0; k--) { const p = CP[k]; p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
      if (p.life <= 0 || p.y > innerHeight + 20) { CP.splice(k, 1); continue; }
      cx2.save(); cx2.globalAlpha = Math.min(1, p.life * 2); cx2.translate(p.x, p.y); cx2.rotate(p.r); cx2.fillStyle = p.c; cx2.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx2.restore(); }
    if (CP.length) requestAnimationFrame(f); else { cfRun = false; cx2.clearRect(0, 0, innerWidth, innerHeight); } };
  requestAnimationFrame(f);
}
function burst(el) { const r = el ? el.getBoundingClientRect() : null; confetti(r ? [r.left + r.width / 2, r.top + r.height / 2] : null); }
