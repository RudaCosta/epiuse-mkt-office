<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPI-USE Office · Home</title>
<meta name="description" content="Home do EPI-USE Office: atalhos por área, agenda e time.">
<link rel="stylesheet" href="/design-tokens.css">
<link rel="stylesheet" href="/css/home-v2.css">
</head>
<body class="hx" data-route="home">
<office-nav></office-nav>

<main class="hx-wrap" id="conteudo">

  <!-- ═══ HERO · saudação + busca (porta de entrada) ═══ -->
  <header class="hx-hero">
    <div class="hx-hero-top">
      <div>
        <p class="hx-eyebrow" id="hero-data">&nbsp;</p>
        <h1 class="hx-title" id="hero-saudacao">Olá 👋</h1>
      </div>
      <label class="hx-persona">
        <span class="hx-sr">Ver a home como</span>
        <select id="persona-select" aria-label="Ver a home como"></select>
      </label>
    </div>
    <button type="button" class="hx-search" id="hx-search" aria-label="Buscar telas, ferramentas e Voices">
      <span class="hx-search-ico" aria-hidden="true">⌕</span>
      <span class="hx-search-txt">Para onde vamos? Busque telas, ferramentas, Voices…</span>
      <kbd class="hx-kbd" id="hx-kbd">Ctrl K</kbd>
    </button>
  </header>

  <!-- ═══ SEUS ATALHOS (por persona) ═══ -->
  <section class="hx-section" data-sec="atalhos" aria-labelledby="t-atalhos">
    <div class="hx-sec-head"><h2 class="hx-sec-title" id="t-atalhos">Seus atalhos</h2></div>
    <nav class="hx-quick home-quick" aria-label="Atalhos"></nav>
  </section>

  <!-- ═══ ÁREAS · atalhos diretos por área ═══ -->
  <section class="hx-section" data-sec="areas" aria-labelledby="t-areas">
    <div class="hx-sec-head">
      <h2 class="hx-sec-title" id="t-areas">Áreas</h2>
      <p class="hx-sec-sub">Tudo de cada time, a um clique.</p>
    </div>
    <div class="hx-areas" id="areas-grid">
      <div class="hx-skel"></div><div class="hx-skel"></div><div class="hx-skel"></div>
    </div>
  </section>

  <!-- ═══ EXPLORAR · demais ferramentas (fonte: OFFICE_NAV_OVERFLOW) ═══ -->
  <section class="hx-section" data-sec="explorar" aria-labelledby="t-explorar">
    <div class="hx-sec-head">
      <h2 class="hx-sec-title" id="t-explorar">Explorar o Office</h2>
    </div>
    <div class="hx-explore" id="explore-grid"></div>
  </section>

  <!-- ═══ AGENDA UNIFICADA ═══ -->
  <section class="hx-section" data-sec="agenda" aria-labelledby="t-agenda">
    <div class="hx-sec-head">
      <h2 class="hx-sec-title" id="t-agenda">Agenda EPI-USE / SAP</h2>
      <a class="hx-link" href="/inbound/calendar">Calendário completo →</a>
    </div>
    <div class="hx-chips" id="evt-tabs" role="group" aria-label="Filtrar camadas da agenda"></div>
    <div id="evt-grid"><div class="hx-skel hx-skel-lg"></div></div>
  </section>

  <!-- ═══ ANIVERSÁRIOS ═══ -->
  <section class="hx-section" data-sec="bdays" aria-labelledby="t-bdays">
    <div class="hx-sec-head"><h2 class="hx-sec-title" id="t-bdays">Próximos aniversários</h2></div>
    <div class="hx-bdays" id="bday-grid"><div class="hx-skel"></div></div>
  </section>

</main>

<!-- Report Modal (itens de atalho com "modal") -->
<div id="report-modal-overlay" class="rpt-overlay" onclick="closeReportModal(event)">
  <div class="rpt-modal" role="dialog" aria-modal="true" aria-labelledby="rpt-modal-title">
    <button class="rpt-close" onclick="closeReportModal(event,true)" aria-label="Fechar">&times;</button>
    <div class="rpt-modal-icon" aria-hidden="true">📊</div>
    <h3 id="rpt-modal-title"></h3>
    <div class="rpt-links" id="rpt-modal-links"></div>
  </div>
</div>

<script>
var REPORT_DATA = {
  epiuse: {
    title: 'Report Mensal · EPI-USE',
    links: [
      { icon: '📊', title: 'Report PPT', sub: 'SharePoint · pasta 2026', href: 'https://epiusebr-my.sharepoint.com/shared?id=%2Fpersonal%2Fti%5Fbrasil%5Fepiuse%5Fcom%5Fbr%2FDocuments%2FEPI%2DUSE%20BRASIL%2FMARKETING%2FReports%2FRelatorio%20MKT%2F2026&listurl=%2Fpersonal%2Fti%5Fbrasil%5Fepiuse%5Fcom%5Fbr%2FDocuments&viewid=0e8042f9%2D73f5%2D484d%2Da921%2Db87b9c27b21c&sharingv2=true&fromShare=true&at=9&CT=1777492954427&OR=OWA%2DNT%2DMail&FolderCTID=0x0120003700CB66B76D7C49A88C95D3B5B153BF' },
      { icon: '📈', title: 'Google Analytics', sub: 'GA4 · epiuse.com.br', href: 'https://analytics.google.com/analytics/web/?authuser=2#/a115827794p261974760/reports/explorer?ruid=all-pages-and-screens,life-cycle,engagement&restoreUserState=true&r=11198002926' }
    ]
  },
  stratview: {
    title: 'Report Mensal · Stratview',
    links: [
      { icon: '📊', title: 'Report PPT', sub: 'SharePoint · pasta 2026', href: 'https://stratviewbr-my.sharepoint.com/personal/ti_brasil_stratview_com_br/_layouts/15/onedrive.aspx?id=%2Fpersonal%2Fti%5Fbrasil%5Fstratview%5Fcom%5Fbr%2FDocuments%2FSTRATVIEW%2FTI%2FBackup%2Falda%2Esilva%40stratview%2Ecom%2Ebr%2FStratview%2FMarketing%20Stratview%2FReport%2F2026&viewid=ddd415bc%2Dce64%2D4b43%2D99e3%2Db67ea0569531&at=9&FolderCTID=0x0120003DEE5B9631D069489395443B8A426B6A&view=0' },
      { icon: '📈', title: 'Google Analytics', sub: 'GA4 · stratview.com.br', href: 'https://analytics.google.com/analytics/web/?authuser=2#/a105333058p351350583/reports/explorer?ruid=e8e0400b-af45-46c9-95c9-61614dc6456b&restoreUserState=true&r=all-pages-and-screens' }
    ]
  }
};

function openReportModal(key) {
  var d = REPORT_DATA[key]; if (!d) return;
  var ov = document.getElementById('report-modal-overlay'); if (!ov) return;
  document.getElementById('rpt-modal-title').textContent = d.title;
  document.getElementById('rpt-modal-links').innerHTML = d.links.map(function(l) {
    return '<a class="rpt-link" href="' + l.href + '" target="_blank" rel="noopener">'
      + '<span class="rl-ico">' + l.icon + '</span>'
      + '<span class="rl-text"><div class="rl-title">' + l.title + '</div><div class="rl-sub">' + l.sub + '</div></span>'
      + '<span class="rl-go">↗</span></a>';
  }).join('');
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeReportModal(e, force) {
  var ov = document.getElementById('report-modal-overlay');
  if (force || e.target === ov) {
    ov.classList.remove('open');
    document.body.style.overflow = '';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    var ov = document.getElementById('report-modal-overlay');
    if (ov && ov.classList.contains('open')) closeReportModal(null, true);
  }
});
</script>

<office-footer></office-footer>
<script src="/i18n.js"></script>
<script src="/office-nav.js"></script>
<script src="/office-footer.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
