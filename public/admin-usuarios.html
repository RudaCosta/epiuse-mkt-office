<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Permissões · EPI-USE Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-tokens.css">
<script src="/office-nav.js" defer></script>
<style>
  /* Só tokens do design system (Regra 8). Tema escuro segue o data-theme do Office. */
  :root {
    --pm-bg: var(--color-neutral-light-bg);
    --pm-surface: var(--color-neutral-light-surface);
    --pm-surface-2: var(--color-neutral-light-surface-2);
    --pm-border: var(--color-neutral-light-border);
    --pm-text: var(--color-neutral-light-text);
    --pm-muted: var(--color-neutral-light-text-muted);
    --pm-dim: var(--color-neutral-light-text-dim);
    --pm-accent: var(--color-brand-deep-blue);
    --pm-accent-soft: var(--color-primary-50);
    --pm-on-accent: var(--color-neutral-light-surface);
  }
  :root[data-theme$="dark"], :root[data-theme="dark"], :root[data-theme="armory"],
  :root[data-theme="aurora"], :root[data-theme="elephant"], :root[data-theme="liquid-glass"] {
    --pm-bg: var(--color-neutral-dark-bg);
    --pm-surface: var(--color-neutral-dark-surface);
    --pm-surface-2: var(--color-neutral-dark-surface-2);
    --pm-border: var(--color-neutral-dark-border);
    --pm-text: var(--color-neutral-dark-text);
    --pm-muted: var(--color-neutral-dark-text-muted);
    --pm-dim: var(--color-neutral-dark-text-dim);
    --pm-accent: var(--color-primary-300);
    --pm-accent-soft: var(--color-neutral-dark-surface-2);
    --pm-on-accent: var(--color-neutral-dark-bg);
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; }
  /* Fundo: o tema do Office (office-nav) pinta o body em todas as páginas. */
  body { margin: 0; color: var(--pm-text);
         font-family: 'Open Sans', Calibri, Verdana, sans-serif; font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 80px; }
  h1, h2 { font-family: Lato, Calibri, sans-serif; margin: 0; }
  h1 { font-size: 26px; font-weight: 900; color: var(--pm-accent); }
  .sub { color: var(--pm-muted); margin: 6px 0 28px; max-width: 640px; }

  .card { background: var(--pm-surface); border: 1px solid var(--pm-border);
          border-radius: var(--rounded-lg); box-shadow: var(--elevation-sm); }
  .add { padding: 20px; margin-bottom: 24px; }
  .add h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  .add-grid { display: grid; grid-template-columns: 1.5fr 1.2fr 1fr auto; gap: 10px; align-items: end; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--pm-muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 9px 11px; border-radius: var(--rounded-md); font: inherit;
                  background: var(--pm-bg); color: var(--pm-text); border: 1px solid var(--pm-border); }
  input:focus, select:focus { outline: 2px solid var(--pm-accent); outline-offset: 1px; }
  .btn { padding: 9px 16px; border-radius: var(--rounded-md); border: 0; cursor: pointer; font: 700 13px Lato, Calibri, sans-serif;
         background: var(--pm-accent); color: var(--pm-on-accent); white-space: nowrap; }
  .btn:disabled { opacity: .5; cursor: default; }

  .bar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar input { flex: 1; min-width: 200px; }
  .bar select { width: auto; }

  .lista { overflow: hidden; }
  .pessoa { border-top: 1px solid var(--pm-border); }
  .pessoa:first-child { border-top: 0; }
  .linha { display: grid; grid-template-columns: minmax(200px, 1.2fr) 200px 1.6fr 110px; gap: 16px;
           align-items: center; padding: 14px 20px; }
  .pessoa.inativa { opacity: .5; }
  .quem b { display: block; font-family: Lato, Calibri, sans-serif; }
  .quem span { font-size: 12px; color: var(--pm-muted); word-break: break-all; }
  .areas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .area { font-size: 12px; padding: 3px 10px; border-radius: var(--rounded-full); font-weight: 600;
          background: var(--pm-accent-soft); color: var(--pm-accent); border: 1px solid transparent; }
  .area.extra { background: transparent; border-color: var(--pm-accent); }
  .mais { min-height: 0; font-size: 12px; padding: 3px 10px; border-radius: var(--rounded-full); cursor: pointer;
          background: transparent; color: var(--pm-muted); border: 1px dashed var(--pm-border); }
  .mais:hover, .mais[aria-expanded="true"] { color: var(--pm-accent); border-color: var(--pm-accent); }
  .painel { padding: 4px 20px 18px; }
  .painel p { margin: 0 0 10px; font-size: 12px; color: var(--pm-muted); }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .opcao { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--rounded-md);
           border: 1px solid var(--pm-border); cursor: pointer; font-size: 13px; background: var(--pm-surface-2); color: var(--pm-text); }
  .opcao[aria-pressed="true"] { border-color: var(--pm-accent); }
  .opcao .tick { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--pm-border); display: inline-grid; place-items: center; font-size: 10px; }
  .opcao[aria-pressed="true"] .tick { background: var(--pm-accent); border-color: var(--pm-accent); color: var(--pm-on-accent); }
  .estado { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-size: 12px; color: var(--pm-muted); }
  /* min-height 0: o polish-pro.css impõe 44px em todo botão (alvo de toque). */
  .toggle { min-height: 0; width: 38px; height: 22px; padding: 0; flex: none; border-radius: 11px; border: 0; cursor: pointer; position: relative;
            background: var(--pm-border); }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
                   background: var(--pm-surface); transition: left .15s; }
  .toggle[aria-checked="true"] { background: var(--pm-accent); }
  .toggle[aria-checked="true"]::after { left: 19px; }
  .trava { font-size: 12px; color: var(--pm-muted); }
  .salvo { font-size: 12px; color: var(--pm-accent); min-height: 18px; }

  .legenda { margin-top: 28px; padding: 18px 20px; }
  .legenda h2 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .legenda dl { display: grid; grid-template-columns: 200px 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
  .legenda dt { font-weight: 600; }
  .legenda dd { margin: 0; color: var(--pm-muted); }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .vazio { padding: 28px; text-align: center; color: var(--pm-muted); }

  @media (max-width: 760px) {
    .add-grid { grid-template-columns: 1fr; }
    .linha { grid-template-columns: 1fr; gap: 10px; }
    .estado { justify-content: flex-start; }
    .legenda dl { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-route="admin-usuarios">
<office-nav></office-nav>
<main class="wrap">
  <h1>Permissões</h1>
  <p class="sub">Quem vê o quê no Office. Cada papel abre as áreas do próprio time; as áreas extras você concede com um clique. Só você enxerga esta tela.</p>

  <section class="card add">
    <h2>Adicionar pessoa</h2>
    <div class="add-grid">
      <div><label for="n-email">E-mail @epiuse</label><input id="n-email" type="email" placeholder="nome.sobrenome@epiuse.com.br" autocomplete="off"></div>
      <div><label for="n-nome">Nome</label><input id="n-nome" type="text" placeholder="Nome completo" autocomplete="off"></div>
      <div><label for="n-papel">Papel</label><select id="n-papel"></select></div>
      <div><button class="btn" id="n-salvar" type="button">Adicionar</button></div>
    </div>
    <div class="msg" id="n-msg" role="status"></div>
  </section>

  <div class="bar">
    <input id="busca" type="search" placeholder="Buscar por nome ou e-mail" aria-label="Buscar pessoa">
    <select id="filtro" aria-label="Filtrar por papel"><option value="">Todos os papéis</option></select>
  </div>
  <section class="card lista" id="lista" aria-live="polite"><div class="vazio">Carregando…</div></section>

  <section class="card legenda">
    <h2>O que cada área abre</h2>
    <dl id="legenda"></dl>
  </section>
</main>

<script>
(function () {
  'use strict';
  // Rótulos em português dos papéis (o id técnico fica só no valor do select).
  var PAPEL = {
    head: 'Super admin', intelligence: 'Intelligence & CRM', growth: 'Growth', field: 'Field Marketing',
    pipeline: 'Biz Dev', brand: 'Brand Experience', conteudo: 'Conteúdo', 'country-manager': 'Diretoria · Country Manager',
    diretoria: 'Diretoria', voice: 'EPI-USE Voice', hub: 'Colaborador'
  };
  var D = null;            // resposta de /api/admin/users
  var $ = function (id) { return document.getElementById(id); };
  // Tudo que vem do banco passa por aqui antes de virar HTML.
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function extras(u) { try { var a = JSON.parse(u.areas_extra || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function ehSuper(u) { return D.super_admins.indexOf(String(u.email).toLowerCase()) !== -1; }

  function opcoesPapel(sel, incluirHead) {
    return D.roles.filter(function (r) { return incluirHead || r !== 'head'; }).map(function (r) {
      return '<option value="' + esc(r) + '"' + (r === sel ? ' selected' : '') + '>' + esc(PAPEL[r] || r) + '</option>';
    }).join('');
  }

  function linha(u) {
    var sup = ehSuper(u);
    var base = (D.role_areas[u.role] || []).filter(function (a) { return a !== 'logado'; });
    var ext = extras(u).filter(function (a) { return base.indexOf(a) === -1; });
    var nome = function (a) { return (D.areas[a] && D.areas[a].nome) || a; };
    var chips = sup ? '<span class="area">Todas as áreas</span>'
      : (base.length ? base.map(function (a) { return '<span class="area" title="Vem do papel">' + esc(nome(a)) + '</span>'; }).join('')
                     : '<span class="area" title="Vem do papel">Só o Hub</span>') +
        ext.map(function (a) { return '<span class="area extra" title="Concedida por você">' + esc(nome(a)) + '</span>'; }).join('') +
        '<button type="button" class="mais" data-abrir aria-expanded="false">Áreas extras</button>';
    var opcoes = sup ? '' : D.concediveis.filter(function (a) { return base.indexOf(a) === -1; }).map(function (a) {
      var on = ext.indexOf(a) !== -1;
      return '<button type="button" class="opcao" data-area="' + esc(a) + '" aria-pressed="' + on + '">' +
             '<span class="tick" aria-hidden="true">' + (on ? '✓' : '') + '</span>' + esc(nome(a)) + '</button>';
    }).join('');
    return '<div class="pessoa' + (u.active ? '' : ' inativa') + '" data-email="' + esc(u.email) + '">' +
      '<div class="linha">' +
        '<div class="quem"><b>' + esc(u.name || u.email.split('@')[0]) + '</b><span>' + esc(u.email) + '</span>' +
          '<div class="salvo" data-salvo></div></div>' +
        (sup ? '<div class="trava">' + esc(PAPEL.head) + '</div>'
             : '<select data-papel aria-label="Papel">' + opcoesPapel(u.role, u.role === 'head') + '</select>') +
        '<div class="areas">' + chips + '</div>' +
        (sup ? '<div class="estado trava">sempre ativo</div>'
             : '<div class="estado"><span>' + (u.active ? 'Ativo' : 'Inativo') + '</span>' +
               '<button type="button" class="toggle" data-ativo role="switch" aria-checked="' + (!!u.active) + '" aria-label="Ativo"></button></div>') +
      '</div>' +
      (sup ? '' : '<div class="painel" hidden><p>Além do que o papel já dá, liberar também:</p><div class="opcoes">' + opcoes + '</div></div>') +
    '</div>';
  }

  var abertos = {};
  function render() {
    var q = $('busca').value.trim().toLowerCase(), f = $('filtro').value;
    var lista = D.users.filter(function (u) {
      return (!f || u.role === f) && (!q || (u.email + ' ' + (u.name || '')).toLowerCase().indexOf(q) !== -1);
    });
    // Super admin primeiro, depois ativos, depois por nome.
    lista.sort(function (a, b) {
      return (ehSuper(b) - ehSuper(a)) || (b.active - a.active) || String(a.name || a.email).localeCompare(String(b.name || b.email));
    });
    $('lista').innerHTML = lista.length ? lista.map(linha).join('') : '<div class="vazio">Ninguém encontrado.</div>';
    Object.keys(abertos).forEach(function (email) {
      var row = document.querySelector('.pessoa[data-email="' + CSS.escape(email) + '"]');
      if (row) { row.querySelector('.painel').hidden = false; row.querySelector('[data-abrir]').setAttribute('aria-expanded', 'true'); }
    });
  }

  async function salvar(email, patch, linhaEl) {
    var aviso = linhaEl && linhaEl.querySelector('[data-salvo]');
    try {
      var r = await fetch('/api/admin/users/' + encodeURIComponent(email), {
        method: 'PUT', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch)
      });
      var d = await r.json();
      if (!d.success) throw new Error(d.error || 'erro');
      var i = D.users.findIndex(function (u) { return u.email === email; });
      if (i !== -1) D.users[i] = d.user;
      render();
      var novo = document.querySelector('.pessoa[data-email="' + CSS.escape(email) + '"] [data-salvo]');
      if (novo) { novo.textContent = 'Salvo — vale no próximo clique da pessoa'; setTimeout(function () { novo.textContent = ''; }, 3500); }
    } catch (e) { if (aviso) aviso.textContent = 'Não salvou: ' + e.message; }
  }

  $('lista').addEventListener('click', function (ev) {
    var el = ev.target.closest('button'); if (!el) return;
    var row = el.closest('.pessoa'); var email = row.dataset.email;
    var u = D.users.find(function (x) { return x.email === email; });
    if (el.hasAttribute('data-abrir')) {
      var painel = row.querySelector('.painel'); painel.hidden = !painel.hidden;
      el.setAttribute('aria-expanded', String(!painel.hidden));
      if (painel.hidden) delete abertos[email]; else abertos[email] = 1;
      return;
    }
    if (el.dataset.area) {
      var ext = extras(u), a = el.dataset.area, i = ext.indexOf(a);
      if (i === -1) ext.push(a); else ext.splice(i, 1);
      salvar(email, { areas_extra: ext }, row);
    } else if (el.hasAttribute('data-ativo')) {
      salvar(email, { active: !u.active }, row);
    }
  });
  $('lista').addEventListener('change', function (ev) {
    if (!ev.target.matches('[data-papel]')) return;
    var row = ev.target.closest('.pessoa');
    salvar(row.dataset.email, { role: ev.target.value }, row);
  });
  $('busca').addEventListener('input', render);
  $('filtro').addEventListener('change', render);

  $('n-salvar').addEventListener('click', async function () {
    var msg = $('n-msg');
    var body = { email: $('n-email').value.trim().toLowerCase(), name: $('n-nome').value.trim(), role: $('n-papel').value, active: true };
    if (!/^[^@\s]+@[^@\s]+$/.test(body.email)) { msg.textContent = 'E-mail inválido.'; return; }
    if (D.users.some(function (u) { return u.email === body.email; })) { msg.textContent = 'Essa pessoa já está na lista — ajuste direto na linha dela.'; return; }
    this.disabled = true;
    try {
      var r = await fetch('/api/admin/users', { method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      var d = await r.json();
      if (!d.success) throw new Error(d.error || 'erro');
      D.users.push(d.user); render();
      msg.textContent = (d.user.name || d.user.email) + ' adicionada como ' + (PAPEL[d.user.role] || d.user.role) + '.';
      $('n-email').value = ''; $('n-nome').value = '';
    } catch (e) { msg.textContent = 'Não salvou: ' + e.message; }
    this.disabled = false;
  });

  async function carregar() {
    try {
      var r = await fetch('/api/admin/users', { credentials: 'same-origin' });
      if (!r.ok) { $('lista').innerHTML = '<div class="vazio">Esta tela é só do super admin.</div>'; return; }
      D = await r.json();
      D.super_admins = (D.super_admins || []).map(function (e) { return String(e).toLowerCase(); });
      $('n-papel').innerHTML = opcoesPapel('hub', false);
      $('filtro').innerHTML = '<option value="">Todos os papéis</option>' + D.roles.map(function (r) {
        return '<option value="' + esc(r) + '">' + esc(PAPEL[r] || r) + '</option>'; }).join('');
      $('legenda').innerHTML = Object.keys(D.areas).filter(function (a) { return a !== 'publico'; }).map(function (a) {
        return '<dt>' + esc(D.areas[a].nome) + '</dt><dd>' + esc(D.areas[a].desc) + '</dd>'; }).join('');
      render();
    } catch (e) { $('lista').innerHTML = '<div class="vazio">Não consegui carregar: ' + esc(e.message) + '</div>'; }
  }
  carregar();
})();
</script>
</body>
</html>
