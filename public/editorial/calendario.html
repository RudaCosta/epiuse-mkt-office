<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendário Editorial — EPI-USE Office</title>
<link rel="stylesheet" href="/design-tokens.css">
<link rel="stylesheet" href="/editorial/editorial.css">
</head>
<body class="home-root" data-route="editorial-calendario">
<office-nav></office-nav>

<main class="edt-wrap">
  <div class="edt-top">
    <div class="edt-titlerow">
      <div>
        <div class="edt-title"><span class="em">📅</span> Calendário Editorial</div>
        <p class="edt-sub">Planejamento semana a semana do LinkedIn EPI-USE Brasil. Espelho da planilha do marketing — o time edita na planilha, o Office reflete.</p>
      </div>
      <div class="edt-actions">
        <span class="edt-lastsync" id="lastSync">—</span>
        <button class="resync-btn" id="resyncBtn"></button>
      </div>
    </div>
    <nav class="edt-tabs">
      <a class="edt-tab" href="/editorial/insights">💡 Insights</a>
      <a class="edt-tab active" href="/editorial/calendario">📅 Calendário</a>
      <a class="edt-tab" href="/editorial/pautas">📝 Pautas</a>
    </nav>
  </div>

  <div id="content"><div class="edt-empty"><div class="big">⏳</div>Carregando…</div></div>
</main>

<office-footer></office-footer>
<script src="/office-nav.js"></script>
<script src="/office-footer.js"></script>
<script src="/editorial/editorial-common.js"></script>
<script>
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function badgeClass(st){
  const s=(st||'').toLowerCase();
  if(s.includes('produ')) return 'b-producao';
  if(s.includes('public')) return 'b-publicado';
  if(s) return 'b-planejado';
  return 'b-vazio';
}
function fmtDate(iso){
  const [y,m,d]=iso.split('-').map(Number);
  return {d:String(d).padStart(2,'0'), m:MESES[m-1]||''};
}
function render(posts){
  const el=document.getElementById('content');
  if(!posts.length){
    el.innerHTML='<div class="edt-empty"><div class="big">📅</div>Nenhum post sincronizado ainda.<br>Clique em <b>Resync</b> para puxar da planilha.</div>';
    return;
  }
  // agrupa por semana preservando ordem cronológica dos dias
  const groups=[]; const idx={};
  for(const p of posts){
    const k=p.semana||'Sem semana';
    if(idx[k]==null){idx[k]=groups.length;groups.push({semana:k,items:[]});}
    groups[idx[k]].items.push(p);
  }
  // semana mais recente no topo (evita rolar até a semana atual);
  // dias dentro de cada semana seguem na ordem natural (seg→sex)
  groups.reverse();
  let html='';
  for(const g of groups){
    html+=`<div class="week-group"><div class="week-head"><h3>${edtEsc(g.semana)}</h3><span class="wk-count">${g.items.length} post(s)</span></div>`;
    for(const p of g.items){
      const dt=fmtDate(p.data);
      const chips=[];
      if(p.tipo) chips.push(`<span class="chip">${edtEsc(p.tipo)}</span>`);
      if(p.formato) chips.push(`<span class="chip">${edtEsc(p.formato)}</span>`);
      if(p.lob) chips.push(`<span class="chip lob">${edtEsc(p.lob)}</span>`);
      if(p.narrativa) chips.push(`<span class="chip">${edtEsc(p.narrativa)}</span>`);
      const st=p.status?`<span class="badge ${badgeClass(p.status)}">${edtEsc(p.status)}</span>`:'';
      const copy=p.copy?`<div class="post-copy clamp" onclick="this.classList.toggle('clamp')" title="clique para expandir">${edtEsc(p.copy)}</div>`:'';
      html+=`<div class="post-row">
        <div class="post-date"><span class="d">${dt.d}</span>${dt.m} · ${edtEsc(p.dia||'')}</div>
        <div class="post-main">
          <div class="post-title">${edtEsc(p.titulo||'(sem título definido)')} ${st}</div>
          <div class="post-meta">${chips.join('')}</div>
          ${copy}
        </div>
      </div>`;
    }
    html+='</div>';
  }
  el.innerHTML=html;
}
async function load(){
  const r=await fetch('/api/editorial/calendario');
  const j=await r.json();
  render(j.posts||[]);
  document.getElementById('lastSync').textContent=edtFmtSync(j.last_sync);
}
edtWireResync(document.getElementById('resyncBtn'), load);
load();
</script>
</body>
</html>
