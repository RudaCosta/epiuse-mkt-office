<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugestão de Pautas — EPI-USE Office</title>
<link rel="stylesheet" href="/design-tokens.css">
<link rel="stylesheet" href="/editorial/editorial.css">
</head>
<body class="home-root" data-route="editorial-pautas">
<office-nav></office-nav>

<main class="edt-wrap">
  <div class="edt-top">
    <div class="edt-titlerow">
      <div>
        <div class="edt-title"><span class="em">📝</span> Sugestão de Pautas</div>
        <p class="edt-sub">Backlog de pautas do blog/LinkedIn por editoria, com keyword, volumetria e links do doc e do artigo.</p>
      </div>
      <div class="edt-actions">
        <span class="edt-lastsync" id="lastSync">—</span>
        <button class="resync-btn" id="resyncBtn"></button>
      </div>
    </div>
    <nav class="edt-tabs">
      <a class="edt-tab" href="/editorial/insights">💡 Insights</a>
      <a class="edt-tab" href="/editorial/calendario">📅 Calendário</a>
      <a class="edt-tab active" href="/editorial/pautas">📝 Pautas</a>
    </nav>
  </div>

  <div id="content"><div class="edt-empty"><div class="big">⏳</div>Carregando…</div></div>
</main>

<office-footer></office-footer>
<script src="/office-nav.js"></script>
<script src="/office-footer.js"></script>
<script src="/editorial/editorial-common.js"></script>
<script>
function linkBtn(href,label){
  if(!href) return '';
  return `<a href="${edtEsc(href)}" target="_blank" rel="noopener">${label}</a>`;
}
function render(pautas){
  const el=document.getElementById('content');
  if(!pautas.length){
    el.innerHTML='<div class="edt-empty"><div class="big">📝</div>Nenhuma pauta sincronizada ainda.<br>Clique em <b>Resync</b> para puxar da planilha.</div>';
    return;
  }
  el.innerHTML=pautas.map(p=>{
    const kv=[];
    if(p.keyword) kv.push(`<span><b>Keyword:</b> ${edtEsc(p.keyword)}</span>`);
    if(p.volumetria) kv.push(`<span><b>Volumetria:</b> ${edtEsc(p.volumetria)}</span>`);
    const links=[
      linkBtn(p.link_doc,'📄 Documento'),
      linkBtn(p.link_artigo,'✍️ Artigo LinkedIn'),
      linkBtn(p.fontes,'🔗 Fonte'),
    ].filter(Boolean).join('');
    return `<div class="pauta">
      <div class="pauta-head"><div class="pauta-editoria">${edtEsc(p.editoria||'—')}</div></div>
      <div class="pauta-tema">${edtEsc(p.tema)}</div>
      <div class="pauta-kv">${kv.join('')}</div>
      ${p.resumo?`<div class="pauta-resumo">${edtEsc(p.resumo)}</div>`:''}
      ${links?`<div class="pauta-links">${links}</div>`:''}
    </div>`;
  }).join('');
}
async function load(){
  const r=await fetch('/api/editorial/pautas');
  const j=await r.json();
  render(j.pautas||[]);
  document.getElementById('lastSync').textContent=edtFmtSync(j.last_sync);
}
edtWireResync(document.getElementById('resyncBtn'), load);
load();
</script>
</body>
</html>
